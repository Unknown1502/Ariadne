[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadne"
version = "0.1.0"
description = "Ariadne - Executable Explanation Protocol. AI explanations that have to prove themselves."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.13"]
gcp = [
  "google-cloud-pubsub>=2.25",
  "google-cloud-firestore>=2.19",
  "google-cloud-storage>=2.18",
  "google-genai>=1.0",
  "google-adk>=1.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
]

[tool.setuptools.packages.find]
include = ["backend*", "benchmark*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "unit: deterministic unit tests",
  "integration: cross-component tests",
  "chaos: failure-injection tests",
  "security: adversarial-input tests",
  "benchmark: deterministic benchmark tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
